<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <!-- Deep Space Background -->
    <circle cx="32" cy="32" r="32" fill="#0f172a"/>
    
    <!-- Galaxy Base (Tilted Purple Ellipses) -->
    <ellipse cx="32" cy="32" rx="26" ry="10" transform="rotate(-25 32 32)" fill="#6b21a8"/>
    <ellipse cx="32" cy="32" rx="18" ry="7" transform="rotate(-25 32 32)" fill="#9333ea"/>
    <ellipse cx="32" cy="32" rx="10" ry="4" transform="rotate(-25 32 32)" fill="#38bdf8"/>
    
    <!-- Spiral Arms (Pink and Cyan Swooshes) -->
    <path d="M 8 36 C 12 52, 32 50, 44 40" stroke="#f472b6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 56 28 C 52 12, 32 14, 20 24" stroke="#22d3ee" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Cartoon Stars -->
    <path d="M 16 10 Q 16 14 20 14 Q 16 14 16 18 Q 16 14 12 14 Q 16 14 16 10" fill="#fde047"/>
    <path d="M 48 48 Q 48 51 51 51 Q 48 51 48 54 Q 48 51 45 51 Q 48 51 48 48" fill="#ffffff"/>
    <circle cx="12" cy="50" r="1.5" fill="#67e8f9"/>
    <circle cx="52" cy="16" r="1" fill="#fde047"/>
    <circle cx="38" cy="10" r="1.5" fill="#ffffff"/>
    
    <!-- Miniature Center Scroll (Scaled down by 25%) -->
    <!-- Paper Background -->
    <rect x="27" y="25" width="10" height="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Text Lines -->
    <line x1="30" y1="30" x2="34" y2="30" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="30" y1="34" x2="34" y2="34" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Top Roll -->
    <rect x="25" y="23" width="14" height="4" rx="2" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <!-- Bottom Roll -->
    <rect x="25" y="37" width="14" height="4" rx="2" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
</svg>
